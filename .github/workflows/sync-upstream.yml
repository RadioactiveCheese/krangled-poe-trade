name: Sync upstream

on:
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write
  pull-requests: write

env:
  UPSTREAM: https://github.com/SnosMe/awakened-poe-trade.git
  SYNC_BRANCH: chore/sync-upstream

jobs:
  sync:
    runs-on: ubuntu-latest
    concurrency:
      group: sync-upstream
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Fetch upstream
        run: |
          git fetch origin main:refs/remotes/origin/main
          git remote add upstream "$UPSTREAM"
          git fetch upstream master

      - name: Count new upstream commits
        id: check
        run: |
          BEHIND=$(git rev-list --count origin/main..upstream/master)
          echo "behind=$BEHIND" >> "$GITHUB_OUTPUT"
          echo "$BEHIND new upstream commit(s)"

          NEEDS_SYNC=false
          if [ "$BEHIND" != "0" ]; then
            if git ls-remote --exit-code --heads origin "$SYNC_BRANCH" >/dev/null 2>&1; then
              git fetch origin "$SYNC_BRANCH:refs/remotes/origin/$SYNC_BRANCH"
              if git merge-base --is-ancestor upstream/master "origin/$SYNC_BRANCH"; then
                echo "The sync branch already contains the latest upstream commit."
              else
                STATUS=$?
                if [ "$STATUS" -eq 1 ]; then
                  NEEDS_SYNC=true
                else
                  echo "::error::Could not compare upstream with the sync branch (status $STATUS)."
                  exit "$STATUS"
                fi
              fi
            else
              STATUS=$?
              if [ "$STATUS" -eq 2 ]; then
                NEEDS_SYNC=true
              else
                echo "::error::Could not query the remote sync branch (status $STATUS)."
                exit "$STATUS"
              fi
            fi
          fi
          echo "needs_sync=$NEEDS_SYNC" >> "$GITHUB_OUTPUT"

      - name: Merge upstream into sync branch
        if: steps.check.outputs.needs_sync == 'true'
        id: merge
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -B "$SYNC_BRANCH" origin/main

          # First make a disposable merge attempt so the draft can report exactly
          # which paths required policy-based conflict resolution.
          if git merge --no-commit --no-ff upstream/master; then
            : > /tmp/upstream-conflicts.txt
            git merge --abort
          else
            git diff --name-only --diff-filter=U | sort > /tmp/upstream-conflicts.txt
            git merge --abort
          fi

          # Keep the fork's side of overlapping hunks. Clean upstream changes are
          # still accepted, and every affected path is called out in the draft PR.
          if ! git merge --no-commit --no-ff -X ours upstream/master; then
            while IFS= read -r -d '' path; do
              if git cat-file -e ":2:$path" 2>/dev/null; then
                git checkout --ours -- "$path"
                git add -- "$path"
              else
                git rm -- "$path"
              fi
            done < <(git diff --name-only --diff-filter=U -z)
          fi

          if git diff --name-only --diff-filter=U | grep -q .; then
            echo '::error::Policy-based conflict resolution left unmerged paths.'
            git diff --name-only --diff-filter=U
            exit 1
          fi

          # These files describe the fork and its automation, not upstream code.
          # Never let an upstream sync rename or remove them.
          git checkout origin/main -- .github docs/.vitepress/config.js

          # Accept dependency updates while retaining fork package names and
          # release versions. Those versions are advanced only by our releases.
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          for directory in ('main', 'renderer'):
              package_path = Path(directory) / 'package.json'
              lock_path = Path(directory) / 'package-lock.json'
              if not package_path.exists():
                  subprocess.run(
                      ['git', 'checkout', 'origin/main', '--', package_path.as_posix()],
                      check=True,
                  )
              original_bytes = subprocess.check_output(
                  ['git', 'show', f'origin/main:{package_path.as_posix()}']
              )
              original = json.loads(original_bytes)
              package = json.loads(package_path.read_text(encoding='utf-8'))
              for key in ('name', 'productName', 'version', 'repository'):
                  if key in original:
                      package[key] = original[key]
              if package == original:
                  subprocess.run(
                      ['git', 'checkout', 'origin/main', '--', package_path.as_posix()],
                      check=True,
                  )
              else:
                  newline = '\r\n' if original_bytes.count(b'\r\n') else '\n'
                  package_path.write_bytes(
                      (json.dumps(package, indent=2) + '\n').replace('\n', newline).encode()
                  )

              if not lock_path.exists():
                  subprocess.run(
                      ['git', 'checkout', 'origin/main', '--', lock_path.as_posix()],
                      check=True,
                  )
              original_lock_bytes = subprocess.check_output(
                  ['git', 'show', f'origin/main:{lock_path.as_posix()}']
              )
              original_lock = json.loads(original_lock_bytes)
              lock = json.loads(lock_path.read_text(encoding='utf-8'))
              for key in ('name', 'version'):
                  if key in original_lock:
                      lock[key] = original_lock[key]
              original_root = original_lock.get('packages', {}).get('', {})
              root = lock.get('packages', {}).get('', {})
              for key in ('name', 'version'):
                  if key in original_root:
                      root[key] = original_root[key]
              if lock == original_lock:
                  subprocess.run(
                      ['git', 'checkout', 'origin/main', '--', lock_path.as_posix()],
                      check=True,
                  )
              else:
                  newline = '\r\n' if original_lock_bytes.count(b'\r\n') else '\n'
                  lock_path.write_bytes(
                      (json.dumps(lock, indent=2) + '\n').replace('\n', newline).encode()
                  )
          PY

          git add --all
          # An ancestry-only sync can intentionally have the same tree as main.
          git commit --no-edit --allow-empty
          git push --force origin "$SYNC_BRANCH"

          {
            echo 'conflicts<<EOF'
            cat /tmp/upstream-conflicts.txt
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Open or update pull request
        if: steps.check.outputs.needs_sync == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CONFLICTS: ${{ steps.merge.outputs.conflicts }}
        run: |
          UPSTREAM_SHA=$(git rev-parse upstream/master)
          COMMIT_COUNT=$(git rev-list --count origin/main..upstream/master)
          CONFLICT_COUNT=$(printf '%s\n' "$CONFLICTS" | sed '/^$/d' | wc -l | tr -d ' ')

          {
            echo '## Upstream changes'
            echo
            echo "Draft sync of **$COMMIT_COUNT commit(s)** through \`SnosMe/awakened-poe-trade@$UPSTREAM_SHA\`."
            echo
            git log --format='- `%h` %s' origin/main..upstream/master
            echo
            echo '## Automated curation'
            echo
            echo '- Preserved this fork’s `.github/` workflows and documentation branding.'
            echo '- Preserved package names, repository metadata, and release version numbers.'
            echo '- Accepted clean upstream changes.'
            if [ "$CONFLICT_COUNT" = "0" ]; then
              echo '- No textual merge conflicts were detected.'
            else
              echo "- Resolved **$CONFLICT_COUNT** textual conflict(s) by retaining the fork side of overlapping hunks:"
              printf '%s\n' "$CONFLICTS" | sed '/^$/d; s/^/  - `/' | sed 's/$/`/'
            fi
            echo
            echo '## Diff summary'
            echo
            echo '```text'
            git diff --stat origin/main...HEAD
            echo '```'
            echo
            echo '## Review required'
            echo
            echo '@RadioactiveCheese: please review the excluded fork metadata and every auto-resolved conflict before marking this PR ready. Clean merges can still conflict semantically with fork-only features.'
            echo
            echo '<!-- sync-upstream-summary -->'
          } > /tmp/pr-body.md

          PR_NUMBER=$(gh pr list --head "$SYNC_BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -n "$PR_NUMBER" ]; then
            gh pr edit "$PR_NUMBER" --body-file /tmp/pr-body.md
            gh pr ready "$PR_NUMBER" --undo || true
            echo "Updated draft PR #$PR_NUMBER."
          else
            gh pr create --draft \
              --base main \
              --head "$SYNC_BRANCH" \
              --title "chore: sync upstream ($(date -u +%Y-%m-%d))" \
              --body-file /tmp/pr-body.md
          fi
