name: Sync upstream

# Upstream work is ported by hand in focused pull requests, so this job never
# merges upstream code. It reports what is still unhandled and, once a stretch
# of upstream history is fully settled, proposes a no-op merge that records it.
# Decisions live in .github/upstream-ledger.json.

on:
  schedule:
    - cron: '37 9 * * *' # Daily
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

env:
  UPSTREAM: https://github.com/SnosMe/awakened-poe-trade.git
  UPSTREAM_REPO: SnosMe/awakened-poe-trade
  BASELINE_BRANCH: chore/upstream-baseline
  REPORT_LABEL: upstream-sync

jobs:
  sync:
    runs-on: ubuntu-latest
    concurrency:
      group: sync-upstream
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Fetch upstream
        run: |
          git fetch origin main:refs/remotes/origin/main
          git remote add upstream "$UPSTREAM"
          git fetch upstream master

      - name: Collect pull requests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/pulls?state=closed&per_page=100" \
            --jq '.[] | select(.merged_at) | {number, body, head: .head.ref, merge_commit_sha}' \
            > "$RUNNER_TEMP/fork-prs.jsonl"
          gh api --paginate "repos/$UPSTREAM_REPO/pulls?state=open&per_page=100" \
            --jq '.[] | {number, title}' \
            > "$RUNNER_TEMP/upstream-prs.jsonl"

      - name: Classify upstream work
        id: ledger
        run: |
          python3 .github/scripts/upstream_sync.py \
            --base origin/main \
            --upstream upstream/master \
            --ledger .github/upstream-ledger.json \
            --fork-prs "$RUNNER_TEMP/fork-prs.jsonl" \
            --upstream-prs "$RUNNER_TEMP/upstream-prs.jsonl" \
            --baseline-branch "$BASELINE_BRANCH" \
            --repo "$GITHUB_REPOSITORY" \
            --report "$RUNNER_TEMP/report.md" \
            --github-output "$GITHUB_OUTPUT"

      - name: Propose upstream baseline
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASELINE: ${{ steps.ledger.outputs.baseline }}
        run: |
          PR_NUMBER=$(gh api --method GET "repos/$GITHUB_REPOSITORY/pulls" \
            -f state=open -f head="$GITHUB_REPOSITORY_OWNER:$BASELINE_BRANCH" -f base=main \
            --jq '.[0].number // empty')

          if [ -z "$BASELINE" ]; then
            # A ledger edit can unsettle commits that an open baseline PR covers.
            # Merging it then would hide them, so withdraw it.
            if [ -n "$PR_NUMBER" ]; then
              gh pr close "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --delete-branch \
                --comment 'Withdrawn: some upstream commits this baseline covered are no longer settled. A new baseline PR opens once they are.'
            fi
            echo 'No upstream baseline to record.'
            exit 0
          fi

          SHORT=${BASELINE:0:8}
          if git ls-remote --exit-code --heads origin "$BASELINE_BRANCH" >/dev/null 2>&1; then
            git fetch origin "$BASELINE_BRANCH:refs/remotes/origin/$BASELINE_BRANCH"
            CURRENT=$(git rev-parse "origin/$BASELINE_BRANCH^2" 2>/dev/null || true)
            CURRENT_BASE=$(git rev-parse "origin/$BASELINE_BRANCH^1")
          fi
          if [ "${CURRENT:-}" = "$BASELINE" ] && [ "${CURRENT_BASE:-}" = "$(git rev-parse origin/main)" ]; then
            echo "The baseline branch already records $SHORT on current main."
          else
            git config user.name  'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git checkout -B "$BASELINE_BRANCH" origin/main
            # -s ours keeps main's files exactly; only the ancestry changes.
            git merge -s ours --no-ff "$BASELINE" \
              -m "chore: record upstream baseline $SHORT" \
              -m "Every upstream commit up to SnosMe/awakened-poe-trade@$BASELINE is adopted or rejected in .github/upstream-ledger.json. This merge changes no files."
            test -z "$(git diff origin/main HEAD)"
            git push --force origin "$BASELINE_BRANCH"
          fi

          {
            echo "Records upstream \`SnosMe/awakened-poe-trade@$BASELINE\` as merged. Every upstream commit up to it is adopted or rejected, so they stop being reported."
            echo
            echo 'This merge changes no files.'
            echo
            echo '> [!IMPORTANT]'
            echo '> Merge with **Create a merge commit**. Squash and rebase merges drop the upstream parent, which is the only thing this pull request adds.'
            echo
            echo "<!-- upstream-baseline: $BASELINE -->"
          } > "$RUNNER_TEMP/baseline-body.md"

          if [ -n "$PR_NUMBER" ]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" \
              --raw-field title="chore: record upstream baseline $SHORT" \
              --raw-field body="$(cat "$RUNNER_TEMP/baseline-body.md")" >/dev/null
            echo "Updated baseline PR #$PR_NUMBER."
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/pulls" \
              --raw-field title="chore: record upstream baseline $SHORT" \
              --raw-field head="$BASELINE_BRANCH" \
              --raw-field base=main \
              --raw-field body="$(cat "$RUNNER_TEMP/baseline-body.md")" \
              --jq '.html_url'
          fi

      - name: Publish report
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPEN_ITEMS: ${{ steps.ledger.outputs.open_items }}
          WARNINGS: ${{ steps.ledger.outputs.warnings }}
        run: |
          gh label create "$REPORT_LABEL" --color C5DEF5 \
            --description 'Upstream sync status report' --repo "$GITHUB_REPOSITORY" 2>/dev/null || true
          ISSUE=$(gh issue list --repo "$GITHUB_REPOSITORY" --label "$REPORT_LABEL" \
            --state open --json number --jq '.[0].number // empty')

          if [ "$OPEN_ITEMS" = '0' ] && [ "$WARNINGS" = '0' ]; then
            if [ -n "$ISSUE" ]; then
              gh issue close "$ISSUE" --repo "$GITHUB_REPOSITORY" \
                --comment 'Every upstream commit and open upstream pull request is settled.'
            fi
            echo 'Nothing upstream needs a decision.'
          elif [ -n "$ISSUE" ]; then
            gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/report.md"
            echo "Updated report issue #$ISSUE."
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --label "$REPORT_LABEL" \
              --title 'Upstream sync status' --body-file "$RUNNER_TEMP/report.md"
          fi
